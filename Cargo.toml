[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
aurora-abi = { path = "crates/aurora-abi" }
aurora-slot = { path = "crates/aurora-slot" }
aurora-span = { path = "crates/aurora-span" }
aurora-diag = { path = "crates/aurora-diag" }
aurora-lexer = { path = "crates/aurora-lexer" }
aurora-ast = { path = "crates/aurora-ast" }
aurora-parser = { path = "crates/aurora-parser" }
aurora-check = { path = "crates/aurora-check" }
aurora-types = { path = "crates/aurora-types" }
aurora-typeck = { path = "crates/aurora-typeck" }
aurora-interp = { path = "crates/aurora-interp" }
aurora-net = { path = "crates/aurora-net" }
aurora-codegen = { path = "crates/aurora-codegen" }
aurora-gfx = { path = "crates/aurora-gfx" }
aurora-shader = { path = "crates/aurora-shader" }
aurora-runtime = { path = "crates/aurora-runtime" }
aurora-gpu = { path = "crates/aurora-gpu" }
aurora-asset = { path = "crates/aurora-asset" }
aurora-render3d = { path = "crates/aurora-render3d" }
aurora-window = { path = "crates/aurora-window" }
aurora-lsp = { path = "crates/aurora-lsp" }
aurora-debug = { path = "crates/aurora-debug" }
aurora-audio = { path = "crates/aurora-audio" }
aurora-std = { path = "crates/aurora-std" }

[profile.release]
opt-level = 3
lto = "thin"

# The regression suite, optimized but not link-time optimized.
#
# `cargo test --release` used to be the gate, and it took over ninety minutes -
# almost all of it LINKING. Each integration test is its own binary and each one
# pulls in the whole runtime (wgpu, rapier, symphonia, cranelift), so thin LTO
# runs once PER TEST BINARY over a graph that size. That is the shipping
# binary's trade, not a test's: a test wants the same optimization level so it
# measures something like real behaviour, and has no reason to pay for
# cross-crate inlining it will never ship.
#
#     cargo test --workspace --profile release-test -j 4
#
# Same opt-level, so the timing-sensitive tests (frame_clock, fixed_stage) still
# measure an optimized build. `debug-assertions` stays on because a test is
# exactly where an overflow should abort rather than wrap.
[profile.release-test]
inherits = "release"
lto = false
debug-assertions = true
