[package]
name = "aurora-render3d"
version.workspace = true
edition.workspace = true
license.workspace = true

# Aurora's GPU 3D renderer: a real wgpu forward renderer (indexed meshes, a
# depth buffer, a perspective camera, directional + ambient lighting, base-color
# textures, and GPU vertex skinning) plus glTF/OBJ model loading and skeletal
# animation. The renderer operates on a borrowed wgpu device/queue so it can
# render headlessly (offscreen, read back for tests) or onto the live window's
# surface, sharing one device.

[dependencies]
# Mesh and material handles: the shared generation-tagged slot store, so a
# freed mesh's handle is rejected rather than inherited by the next upload.
aurora-slot.workspace = true
# Geometry, skeletons, clips and every importer. Kept out of this crate so the
# offline asset baker never has to link a renderer to read a source file.
aurora-asset.workspace = true
wgpu = "22"
pollster = "0.3"
glam = { version = "0.29", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]
aurora-fixtures.workspace = true
# Tests only: writing a real PNG for the shared-texture test. Naming a FILE is
# the whole mechanism now, so a test that handed pixels over could not exercise
# it - and the assertion that an uploaded file is never READ again needs a file
# that exists and can then be deleted.
image = { version = "0.25", default-features = false, features = ["png"] }
