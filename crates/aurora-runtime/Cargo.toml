[package]
name = "aurora-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

# The Aurora native runtime: host functions (`aurora_*`) that compiled Aurora
# code calls. Built as a normal rlib so the JIT can take their addresses, and
# linked into AOT executables so the same symbols resolve at link time.

[dependencies]
# The one builtin table: `force_link` is generated from it.
aurora-abi.workspace = true
aurora-gfx.workspace = true
aurora-audio.workspace = true
aurora-window.workspace = true
# The heightfield type the terrain renderer, the terrain collider, and the
# `terrain_height` query all read from.
aurora-render3d.workspace = true
aurora-gpu.workspace = true
aurora-net.workspace = true
# Image decoding for the asset pipeline (PNG/JPEG → RGBA), used by `load_image`.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# TrueType rasterization for `draw_text` (pure Rust).
fontdue = "0.9"
# WAV decoding for `play_wav` (pure Rust).
hound = "3"
# JSON parse/serialize for the data builtins (preserve_order keeps key
# iteration and round-trips in document order, deterministically).
serde_json = { version = "1", features = ["preserve_order"] }
# Real 2D + 3D physics (Rapier) and weighted A* pathfinding, exposed as builtins.
rapier2d = "0.22"
rapier3d = "0.22"
pathfinding = "4"
